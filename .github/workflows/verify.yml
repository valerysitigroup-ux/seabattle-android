name: Verify and build game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open source bundle
        run: unzip -q source-bundle.zip -x 'SeaBattle/.github/*'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SeaBattle/server/package-lock.json
      - run: npm ci
        working-directory: SeaBattle/server
      - run: npm test
        working-directory: SeaBattle/server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open source bundle
        run: unzip -q source-bundle.zip -x 'SeaBattle/.github/*'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: SeaBattle
      - uses: actions/upload-artifact@v4
        with:
          name: SeaBattle-v0.13-Android
          path: SeaBattle/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-verification
          path: |
            SeaBattle/app/build/reports/
            SeaBattle/app/build/test-results/

